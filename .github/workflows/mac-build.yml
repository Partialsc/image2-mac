name: Build macOS DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:desktop:mac
        env:
          VITE_VIBELEARNING_PRESET: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ github.ref_name }}
          path: release/*.dmg
          retention-days: 90
          if-no-files-found: error
